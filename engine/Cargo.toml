[workspace]
resolver = "2"
members = ["crates/optimizer-core", "crates/optimizer-service"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
time = { version = "0.3", features = ["parsing", "formatting"] }

[profile.release]
overflow-checks = true
