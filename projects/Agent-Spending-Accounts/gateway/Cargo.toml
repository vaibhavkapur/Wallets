[package]
name = "asa-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Agent Spending Accounts payment/resource gateway (x402)"
license = "UNLICENSED"
publish = false

[lib]
name = "asa_gateway"
path = "src/lib.rs"

[[bin]]
name = "asa-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
rand = "0.8"
anyhow = "1"
futures-util = "0.3"
bytes = "1"
http = "1"

[dev-dependencies]
proptest = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
lto = "thin"
codegen-units = 1
