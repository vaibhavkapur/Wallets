services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recurring_agent
    ports:
      - "5433:5432"
    volumes:
      - ./backend/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recurring_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADDR: 0.0.0.0:8090
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/recurring_agent?sslmode=disable
      DEMO_MODE: "true"
      RUN_EMBEDDED_WORKER: "false"
      ALLOWED_ORIGIN: http://127.0.0.1:5190
    ports:
      - "8090:8090"

  worker:
    build: .
    command: ["recurring-worker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/recurring_agent?sslmode=disable
      WORKER_ID: compose-worker-1
